name: madmd
options:
  bundleIdPrefix: app.madmd
  deploymentTarget:
    macOS: '14.0'
configs:
  Debug: debug
  Release: release
  AppStore: release
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '7'
  configs:
    AppStore:
      CODE_SIGN_IDENTITY: Apple Development
      DEVELOPMENT_TEAM: H7B584W2D6
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_STORE
targets:
  madmd:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: QuickLook/PreviewViewController.swift
      - path: Web/dist
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: madmd
        CFBundleName: madmd
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        CFBundleIconFile: madmd.icns
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: '14.0'
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes: [net.daringfireball.markdown, public.markdown]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkdn, mkd, mdwn]
              public.mime-type: text/markdown
          - UTTypeIdentifier: public.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.madmd.mac
        CODE_SIGN_ENTITLEMENTS: App/madmd.entitlements
      configs:
        AppStore:
          CODE_SIGN_ENTITLEMENTS: App/madmd-appstore.entitlements
    dependencies:
      - target: madmdQuickLook
        embed: true
      - target: madmdHelper
        embed: false
    postBuildScripts:
      - name: Embed helper in App Store builds
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          items="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LoginItems"
          rm -rf "$items"
          if [[ "$CONFIGURATION" == AppStore ]]; then
            mkdir -p "$items"
            ditto "$BUILT_PRODUCTS_DIR/madmdHelper.app" "$items/madmdHelper.app"
          fi
  madmdQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - QuickLook/PreviewViewController.swift
      - QuickLook/PrivacyInfo.xcprivacy
      - Shared
      - path: Web/quicklook/dist
        type: folder
        buildPhase: resources
    info:
      path: QuickLook/Info.plist
      properties:
        CFBundleDisplayName: madmd
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportedContentTypes: [net.daringfireball.markdown, public.markdown, com.unknown.md, io.typora.markdown, net.ia.markdown, com.nutstore.down]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.madmd.mac.quicklook
        CODE_SIGN_ENTITLEMENTS: QuickLook/madmdQuickLook.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
      configs:
        AppStore:
          CODE_SIGN_ENTITLEMENTS: QuickLook/madmdQuickLook-appstore.entitlements
  madmdHelper:
    type: application
    platform: macOS
    sources:
      - Helper
      - Shared/HelperChannel.swift
      - Shared/DocumentResourceReader.swift
    info:
      path: Helper/Info.plist
      properties:
        CFBundleDisplayName: madmd Helper
        CFBundleName: madmdHelper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: '14.0'
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: H7B584W2D6.app.madmd.helper
        CODE_SIGN_ENTITLEMENTS: Helper/madmdHelper.entitlements
        SKIP_INSTALL: YES
schemes:
  madmd:
    build:
      targets:
        madmd: all
    archive:
      config: AppStore
